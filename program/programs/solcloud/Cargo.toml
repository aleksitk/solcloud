[package]
name = "solcloud"
version = "0.1.0"
description = "SolCloud — verifiable off-chain compute for Solana"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]
name = "solcloud"

[features]
default = []
cpi = ["no-entrypoint"]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
idl-build = ["anchor-lang/idl-build"]

[dependencies]
anchor-lang = "0.31.1"
