[workspace]
members = ["programs/*"]
resolver = "2"

# Solana CLI 3.1.2 ships cargo-build-sbf with platform-tools v1.52 (Rust 1.89).
[workspace.metadata.solana]
tools-version = "v1.52"

[profile.release]
overflow-checks = true
lto = "fat"
codegen-units = 1

[profile.release.build-override]
opt-level = 3
incremental = false
codegen-units = 1
